name: uts_infofix
description: UTS InfoFix - Sistema de reportes de laboratorios UTS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  intl: ^0.19.0
  path_provider: ^2.1.2
  uuid: ^4.3.3
  mobile_scanner: ^5.1.1
  # Firebase
  firebase_core: ^2.24.2
  cloud_firestore: ^4.15.9
  firebase_auth: ^4.17.9
  firebase_storage: ^11.7.6
  firebase_messaging: ^14.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
